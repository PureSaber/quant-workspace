[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-workspace"
version = "0.2.0"
description = "Path resolver and immutable stack manifest for the PureSaber quant stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "packaging>=23.2",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.9.0"]

[project.scripts]
quant-workspace = "quant_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["quant_workspace"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "puresaber.stack-manifest", version = "1.0.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
