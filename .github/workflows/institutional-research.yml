name: Institutional research acceptance
on:
  pull_request:
    paths: ['profiles/institutional-research/**', '.github/workflows/institutional-research.yml']
  push:
    paths: ['profiles/institutional-research/**', '.github/workflows/institutional-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-workspace
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned sources and verify three research workflows
        env:
          PYTHONUTF8: '1'
        run: python quant-workspace/profiles/institutional-research/ci.py
