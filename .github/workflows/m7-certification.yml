name: M7 Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.lock
          pip check
          pip install -e . --no-deps --no-build-isolation
          pip check

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Pytest
        run: >-
          pytest -q --cov=quant_workspace --cov-branch --cov-report=term-missing
          --cov-report=json:coverage.json --cov-fail-under=80

      - name: Core contract coverage
        shell: bash
        run: |
          python - <<'PY'
          import json

          report = json.load(open("coverage.json", encoding="utf-8"))
          for module in ("stack_manifest.py", "m7_certification.py"):
              path = next(
                  key
                  for key in report["files"]
                  if key.replace(chr(92), "/").endswith(f"quant_workspace/{module}")
              )
              summary = report["files"][path]["summary"]
              covered = summary["covered_branches"]
              total = summary["num_branches"]
              ratio = covered / total if total else 1.0
              print(f"{module} pure branch coverage: {covered}/{total} = {ratio:.2%}")
              if ratio < 0.90:
                  raise SystemExit(f"{module} pure branch coverage must be >= 90%")
          PY
