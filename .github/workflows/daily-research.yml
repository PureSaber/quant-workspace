name: Daily research install closure
on:
  push:
    branches: [main, master]
    paths: ['profiles/daily-research/**', '.github/workflows/daily-research.yml']
  pull_request:
    paths: ['profiles/daily-research/**', '.github/workflows/daily-research.yml']
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install the complete frozen closure
        run: python -m pip install --no-deps -r profiles/daily-research/requirements.lock
      - name: Verify exact dependency versions and VCS provenance
        run: python profiles/daily-research/verify.py
      - name: Exercise installed application entry points
        run: |
          python -m a_share_multifactor.decision_workflow --help
          python -m quant_portfolio.account_import --help
          python -m quant_report_hub.cli dashboard --help
          python -m quant_pipeline.daily --help
          python -m quant_data_kit.research_inputs --help
          qdk-providers --capability prices.raw
