name: Durable research integration

on:
  pull_request:
    paths:
      - profiles/durable-research/**
      - .github/workflows/durable-research.yml
  push:
    branches: [main, master]
    paths:
      - profiles/durable-research/**
      - .github/workflows/durable-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the six pinned packages
        run: python profiles/durable-research/bootstrap.py --root installed-durable
      - name: Check profile code and exercise the installed stack
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=installed-durable/env/Scripts/python.exe
          else
            PYTHON=installed-durable/env/bin/python
          fi
          "$PYTHON" -I -m ruff check profiles/durable-research
          "$PYTHON" -I -m ruff format --check profiles/durable-research
          "$PYTHON" -I profiles/durable-research/smoke.py --root installed-durable
